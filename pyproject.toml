[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-mutualfund-chatbot"
version = "0.1.0"
description = "Facts-only Kotak mutual-fund FAQ assistant (RAG)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.2",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "groq>=0.11.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "streamlit>=1.39.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[project.scripts]
mf-api = "src.api.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
