# Phase 6 — Daily corpus refresh (fetch → parse → chunk → embed → Chroma upsert).
# Schedule: 10:00 AM IST (04:30 UTC) every day.
# Manual: Actions → Daily corpus ingest → Run workflow (optional scheme_id).

name: Daily corpus ingest

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      scheme_id:
        description: "Optional scheme_id to refresh a single scheme (e.g. kotak_large_cap_direct_growth)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Refresh corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingest pipeline
        env:
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          VECTOR_STORE_PATH: data/vectorstore
          CHROMA_COLLECTION: mutual_fund_chunks
          MANIFEST_PATH: data/manifest.yaml
          RAW_DIR: data/raw
          PARSED_DIR: data/processed/parsed
          CHUNKS_DIR: data/processed/chunks
          STRUCTURED_FACTS_PATH: data/processed/structured_facts.yaml
          FETCH_FALLBACK_CACHED: "true"
          FETCH_RETRY_COUNT: "3"
          FETCH_INTER_SCHEME_DELAY_SECONDS: "1.5"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LOG_LEVEL: INFO
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          TRANSFORMERS_VERBOSITY: error
        run: |
          set -euo pipefail
          ARGS=(--fetch-fallback-cached)
          if [ -n "${{ inputs.scheme_id }}" ]; then
            ARGS+=(--scheme-id "${{ inputs.scheme_id }}")
          fi
          python -m src.ingest.run "${ARGS[@]}"

      - name: Run retrieval smoke probes
        env:
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          VECTOR_STORE_PATH: data/vectorstore
          CHROMA_COLLECTION: mutual_fund_chunks
        run: python scripts/retrieval_probe.py

      - name: Commit refreshed corpus
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/vectorstore
          if git diff --staged --quiet; then
            echo "No corpus changes to commit."
            exit 0
          fi
          git commit -m "chore(ingest): daily corpus refresh $(date -u +%Y-%m-%d)"
          # Ingest can take several minutes; rebase onto latest main before push.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5: rebasing onto origin/main..."
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Corpus push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected; waiting before retry..."
            sleep $((attempt * 3))
          done
          echo "Failed to push corpus commit after 5 attempts."
          exit 1
