# Phase 6 — Daily corpus refresh (fetch → parse → chunk → embed → Chroma upsert).
# Schedule: 10:00 AM IST (04:30 UTC) every day.
# Manual: Actions → Daily corpus ingest → Run workflow (optional scheme_id).
#
# IMPORTANT: Use "Run workflow" (not "Re-run jobs" on an old run) to pick up workflow fixes.

name: Daily corpus ingest

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      scheme_id:
        description: "Optional scheme_id to refresh a single scheme (e.g. kotak_large_cap_direct_growth)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Refresh corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingest pipeline
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          GITHUB_ACTIONS: "true"
          TQDM_DISABLE: "1"
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          VECTOR_STORE_PATH: data/vectorstore
          CHROMA_COLLECTION: mutual_fund_chunks
          MANIFEST_PATH: data/manifest.yaml
          RAW_DIR: data/raw
          PARSED_DIR: data/processed/parsed
          CHUNKS_DIR: data/processed/chunks
          STRUCTURED_FACTS_PATH: data/processed/structured_facts.yaml
          FETCH_FALLBACK_CACHED: "true"
          FETCH_RETRY_COUNT: "3"
          FETCH_INTER_SCHEME_DELAY_SECONDS: "1.5"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LOG_LEVEL: INFO
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          TRANSFORMERS_VERBOSITY: error
        run: |
          set -euo pipefail
          echo "=== INGEST PIPELINE START | sha=$(git rev-parse --short HEAD) | $(date -u -Iseconds) ==="
          ARGS=(--fetch-fallback-cached)
          if [ -n "${{ inputs.scheme_id }}" ]; then
            ARGS+=(--scheme-id "${{ inputs.scheme_id }}")
          fi
          stdbuf -oL -eL python -u -m src.ingest.run "${ARGS[@]}"
          echo "=== INGEST PIPELINE END | exit=$? ==="

      - name: Run retrieval smoke probes
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_ACTIONS: "true"
          LOG_LEVEL: INFO
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          VECTOR_STORE_PATH: data/vectorstore
          CHROMA_COLLECTION: mutual_fund_chunks
        run: |
          echo "=== RETRIEVAL PROBES START | $(date -u -Iseconds) ==="
          stdbuf -oL -eL python -u scripts/retrieval_probe.py

      - name: Commit refreshed corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/commit_corpus_refresh.sh
